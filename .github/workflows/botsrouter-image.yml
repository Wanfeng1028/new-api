name: botsrouter-image

on:
  push:
    branches: [botsrouter]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t botsrouter/new-api:latest .
      - name: Ship image to Japan server over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s\n" "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "20.222.15.177 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA7LgAl2pZWavVpbvYgU6Ng/iSwmxO4Au96/+sKCHRXY" > ~/.ssh/known_hosts
          docker save botsrouter/new-api:latest | gzip | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=30 azureuser@20.222.15.177 deploy
