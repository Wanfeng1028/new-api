name: botsrouter-image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t botsrouter/new-api:latest .
      - name: Save image
        run: docker save botsrouter/new-api:latest | gzip > new-api-image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-image
          path: new-api-image.tar.gz
          retention-days: 3
