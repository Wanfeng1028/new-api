<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>BotsRouter</title>
    <meta name="title" content="BotsRouter" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- Tab icons: the raster set under /static/icons/ is embedded in
         the app bundle, so it stays reachable on the console hosts even
         where root asset paths redirect to the official site. Safari
         does not render SVG favicons, so the PNG declarations come
         first; the SVG is kept for browsers that prefer it. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/static/icons/icon-192.png"
    />
    <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/static/icons/apple-touch-icon.png"
    />
    <!-- BotsRouter: two UI modes (see src/lib/ui-mode.ts). Resolve the
         mode and the theme class before first paint so neither flashes.
         The default `botsrouter` mode is light-only and pins the light
         class; the admin-only `newapi` mode restores the upstream
         behaviour and honours the saved light / dark / system
         preference. Kept in sync with UiModeProvider + ThemeProvider
         and with the storage keys they use. -->
    <script>
      ;(function () {
        // BotsRouter: shared language preference (review F-17). The
        // official site and this console live on different subdomains,
        // so localStorage is not shared; the `br-lang` cookie on the
        // parent domain is the shared carrier. Sync it into i18next's
        // storage key before the bundle (and its i18n init) runs.
        // Mapping: shared `zh` -> console `zhCN`; console-only codes
        // pass through; unknown values are ignored so the existing
        // local preference / English fallback stays in charge.
        try {
          var langMatch = document.cookie.match(/(?:^|;\s*)br-lang=([^;]*)/)
          if (langMatch) {
            var sharedLang = decodeURIComponent(langMatch[1])
            var consoleLang = sharedLang === 'zh' ? 'zhCN' : sharedLang
            if (
              ['en', 'zhCN', 'zhTW', 'fr', 'ru', 'ja', 'vi'].indexOf(
                consoleLang
              ) >= 0
            ) {
              localStorage.setItem('i18nextLng', consoleLang)
            }
          }
        } catch (e) {}
        var uiMode = 'botsrouter'
        try {
          // Review F-06 (residual): the stored `newapi` preference is
          // honoured before first paint only when a session hint cookie
          // says someone is (or was) signed in on this host. Without a
          // hint the visitor is anonymous, UiModeProvider will force
          // the default mode once bootstrap settles anyway, and painting
          // `newapi` first only produced a flip on every refresh.
          var hasSessionHint = /(?:^|;\s*)new_api_has_session=1(?:;|$)/.test(
            document.cookie || ''
          )
          if (
            hasSessionHint &&
            localStorage.getItem('botsrouter:ui-mode:v1') === 'newapi'
          ) {
            uiMode = 'newapi'
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-ui-mode', uiMode)
        if (uiMode !== 'newapi') {
          document.documentElement.classList.add('light')
          return
        }
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!-- BotsRouter: self-hosted Liberation Serif (metric-compatible with
         Times New Roman; SIL Open Font License, see fonts/LICENSE.txt in
         the served root), registered as "BR Serif" — the UI font used
         across the panel, matching the official website. Declared inline
         here because Rsbuild's CSS pipeline resolves url() as module
         requests; the files live in public/fonts and are served at the
         literal /fonts/ path. -->
    <style>
      @font-face {
        font-family: 'BR Serif';
        src: url('/fonts/br-serif-regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'BR Serif';
        src: url('/fonts/br-serif-bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'BR Serif';
        src: url('/fonts/br-serif-italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'BR Serif';
        src: url('/fonts/br-serif-bolditalic.woff2') format('woff2');
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
