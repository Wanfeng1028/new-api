<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- BotsRouter: the console is light-only. Pin the light class before
         first paint; a saved dark/system preference is deliberately
         ignored. Kept in sync with ThemeProvider, which resolves every
         theme value to light. -->
    <script>
      ;(function () {
        document.documentElement.classList.add('light')
      })()
    </script>
    <!-- BotsRouter: self-hosted Liberation Serif (metric-compatible with
         Times New Roman; SIL Open Font License, see fonts/LICENSE.txt in
         the served root), registered as "BR Serif" — the UI font used
         across the panel, matching the official website. Declared inline
         here because Rsbuild's CSS pipeline resolves url() as module
         requests; the files live in public/fonts and are served at the
         literal /fonts/ path. -->
    <style>
      @font-face {
        font-family: 'BR Serif';
        src: url('/fonts/br-serif-regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'BR Serif';
        src: url('/fonts/br-serif-bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'BR Serif';
        src: url('/fonts/br-serif-italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'BR Serif';
        src: url('/fonts/br-serif-bolditalic.woff2') format('woff2');
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
